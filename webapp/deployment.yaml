apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: 471730255951.dkr.ecr.ap-northeast-2.amazonaws.com/webapp:821add1db1d33c3c65c4d3f65cb4b2048746b2da
          ports:
            - containerPort: 80
